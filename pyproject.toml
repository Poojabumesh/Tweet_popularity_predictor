[build-system]
requires      = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "tweet-popularity-predictor"
version         = "0.1.0"
description     = "Multi-task tweet emotion, hashtag, and popularity predictor"
authors         = [{ name = "Pooja Baralu umesh", email = "poojabumesh@gmail.com" }]
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "pandas",
    "numpy",
    "torch",
    "transformers",
    "scikit-learn"
]

[project.scripts]           # ← exposes the CLI
tpp = "tpp.cli:main"

[tool.setuptools.packages.find]
where = ["src"] 
